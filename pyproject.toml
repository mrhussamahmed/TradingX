[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingx"
version = "0.1.0"
description = "TradingX Phase 0 walking skeleton and scaffolding."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alpaca-py>=0.43,<0.44",
  "pytz",
  "python-dotenv>=1.2,<1.3",
  "nautilus-trader>=1.221,<1.222",
  "prometheus-client>=0.25,<1",
  "python-telegram-bot>=22.7,<23",
]

[dependency-groups]
dev = [
  "black>=24,<27",
  "mypy>=1,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
tradingx = "tradingx.__main__:main"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
]
markers = [
  "smoke: tests that exercise real external integrations",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["tradingx"]

[tool.hatch.build.targets.wheel]
packages = ["src/tradingx"]
